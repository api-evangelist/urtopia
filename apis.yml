name: Urtopia
description: >-
  Urtopia designs and sells smart carbon-fiber electric bikes, pairing
  lightweight frames and premium components with a connected riding experience
  through the companion Urtopia App. The company is backed by DCM Ventures and
  sells direct through its Shopify-powered storefront at newurtopia.com (with
  regional stores for Europe and Australia and a B2B dealer portal), where the
  store exposes an agent-ready commerce surface: a published llms.txt with
  agent instructions, a Universal Commerce Protocol (UCP) merchant profile at
  /.well-known/ucp, and live MCP endpoints for catalog search, cart, and
  buyer-approved checkout.
